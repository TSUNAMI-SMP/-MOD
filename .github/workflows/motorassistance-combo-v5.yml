name: Build MotorAssistance T-G-F Combo (Verified Slot-Switch Combo)
on:
  push:
    paths:
      - .github/workflows/motorassistance-combo-v5.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and package combo
        run: python3 MotorAssistance/build_combo_v5.py
      - name: Validate compiled JAR
        run: |
          python3 - <<'PY'
          import json,zipfile
          path="MotorAssistance/motorassistancemod-fabric-1.21.11-pvp.23-unified-combo-v5.jar"
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              mix=json.loads(z.read("motorassistancemod.mixins.json"))
              assert all(name in mix["mixins"] for name in ("ComboKeyboardMixin","ComboClientMixin","ComboClientInvoker","ComboKeyboardInvoker"))
              bytecode=z.read("dev/gallon/motorassistance/fabric/combat/ComboSequencer.class")
              assert b"key.motorassistancemod.auto_attack" in bytecode
              assert b"firstRightNs" in bytecode and b"gExpectedSlot" in bytecode and b"slotReadyNs" in bytecode
              service=z.read("dev/gallon/motorassistance/common/services/MotorAssistanceService.class")
              assert bytes.fromhex("2a b4 00 41 b6 01 1b") not in service
          print("Pass: archive, mixins, combo logic, simulated slot switching, missing getter.")
          PY
      - name: Publish built JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MotorAssistance/motorassistancemod-fabric-1.21.11-pvp.23-unified-combo-v5.jar
          git diff --cached --quiet || git commit -m "Publish MotorAssistance randomized T-G-F combo JAR"
          git push
