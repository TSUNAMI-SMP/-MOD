name: Build MotorAssistance v12 - Slight Slot 3 Swap Reliability
on:
  push:
    paths:
      - .github/workflows/motorassistance-combo-v12.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch only 3-slot R special attack timing and verify other features
        run: python3 MotorAssistance/build_combo_v12.py
      - name: Publish v12 JAR to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MotorAssistance/motorassistancemod-fabric-1.21.11-pvp.23-unified-combo-v12.jar
          git diff --cached --quiet || git commit -m "Publish v12: modestly increase slot-three swap timing reliability"
          git push
