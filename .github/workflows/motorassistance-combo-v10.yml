name: Build MotorAssistance Slot7 RightClick Macro v10 (Real Cloth Config ABI)
on:
  push:
    paths:
      - .github/workflows/motorassistance-combo-v10.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and package combo
        run: python3 MotorAssistance/build_combo_v10.py
      - name: Validate compiled JAR
        run: |
          python3 - <<'PY'
          import json,zipfile
          path="MotorAssistance/motorassistancemod-fabric-1.21.11-pvp.23-unified-combo-v10.jar"
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              mix=json.loads(z.read("motorassistancemod.mixins.json"))
              assert all(name in mix["mixins"] for name in ("ComboMouseMixin","ComboClientMixin","ComboClientInvoker","ComboKeyboardInvoker"))
              bytecode=z.read("dev/gallon/motorassistance/fabric/combat/ComboSequencer.class")
              assert b"slotSevenRightClickComboEnabled" in bytecode
              assert b"onMouseButton" in bytecode
              assert b"KEY_T" not in bytecode
              assert "ComboKeyboardMixin" not in mix["mixins"]
              assert b"KEY_F" not in bytecode
              assert b"fReleaseNs" not in bytecode
              assert b"firstClickNs" in bytecode and b"expectedGSlot" in bytecode
              assert b"motorassistancemod$getItemUseCooldown" in bytecode
              assert b"configErrorLogged" in bytecode
              assert b"field_1752" not in bytecode
              config=z.read("dev/gallon/motorassistance/fabric/config/TheModConfig.class")
              assert b"slotSevenRightClickComboEnabled" in config
              assert b"modConfig" in config
              assert b"AutoConfig" in bytecode
              assert "ComboMouseMixin" in mix["mixins"]
              assert len(mix["mixins"]) == 9
              ja=json.loads(z.read("assets/motorassistancemod/lang/ja_jp.json"))
              en=json.loads(z.read("assets/motorassistancemod/lang/en_us.json"))
              key="text.autoconfig.motorassistancemod.option.slotSevenRightClickComboEnabled"
              assert key in ja and key in en
              assert len(z.namelist()) == len(set(z.namelist()))
              service=z.read("dev/gallon/motorassistance/common/services/MotorAssistanceService.class")
              assert bytes.fromhex("2a b4 00 41 b6 01 1b") not in service
          print("Pass: archive, mixins, combo logic, simulated slot switching, missing getter.")
          PY
      - name: Publish built JAR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MotorAssistance/motorassistancemod-fabric-1.21.11-pvp.23-unified-combo-v10.jar
          git diff --cached --quiet || git commit -m "Publish v10 slot7 mouse macro with real Cloth Config API verification"
          git push
